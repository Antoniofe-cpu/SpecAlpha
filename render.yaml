# Render Blueprint per Speculative Alpha — Backend FastAPI
# Documentazione: https://render.com/docs/blueprint-spec
#
# COME USARLO:
# 1. Push del repo su GitHub
# 2. Su render.com → New → Blueprint → seleziona il repo
# 3. Render legge questo file e crea il servizio automaticamente
# 4. Imposta le environment variables segnate con sync:false (vedi DEPLOY.md)

services:
  - type: web
    name: speculative-alpha-backend
    runtime: python
    plan: free               # cambia in 'starter' (7$/mese) per evitare il cold-start
    region: frankfurt        # vicino all'Italia; opzioni: oregon, ohio, virginia, frankfurt, singapore
    rootDir: backend
    buildCommand: pip install --extra-index-url https://d33sy5i8bnduwe.cloudfront.net/simple/ -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10
      - key: MONGO_URL
        sync: false          # da impostare manualmente nel dashboard Render
      - key: DB_NAME
        value: speculativealpha
      - key: GEMINI_API_KEY
        sync: false          # da impostare manualmente nel dashboard Render
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: COT_CACHE_TTL_HOURS
        value: "6"
      - key: CORS_ORIGINS
        sync: false          # es: https://speculativealpha.com,https://www.speculativealpha.com
